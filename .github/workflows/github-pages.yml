name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - docs/**
      - data/chart_seeds/**
      - scripts/export_market_indicator_catalog.py
      - scripts/export_market_indicator_sqlite.py
      - scripts/stage_market_indicator_pages.py
      - .github/workflows/github-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Serialize with the forecast deployment; never cancel an active publish.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Stage only tracked reviewed Pages files and native chart database
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/stage_market_indicator_pages.py --output-dir _site --previous-base-url "$PAGES_BASE_URL/data"

      - name: Upload artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for uploaded Pages artifact
        uses: ./.github/actions/wait-for-pages-artifact
        with:
          artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
