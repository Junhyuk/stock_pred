name: Premarket smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premarket-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: |
          set -eu
          python -m pip install "exchange-calendars>=4.5" "pandas>=2.2" "numpy>=1.26" "scikit-learn>=1.4" "pytest>=8.0"

      - name: Trading-day gate
        id: gate
        run: python scripts/premarket_trading_day_gate.py

      - name: Gate and price-refresh tests
        run: |
          set -eu
          python -m pytest -q \
            tests/test_premarket_trading_day_gate.py \
            tests/test_premarket_workflow_smoke.py

      - name: Robo Stock accuracy smoke
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q \
            tests/test_accuracy_audit.py \
            tests/test_accuracy_research.py \
            tests/test_robo_stock_accuracy_cli.py \
            tests/test_collect_robo_yields.py \
            tests/test_session_input_store.py \
            tests/test_fundamental_research.py
