name: Premarket smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premarket-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: |
          set -eu
          python -m pip install "exchange-calendars>=4.5" "pandas>=2.2" "numpy>=1.26" "pytest>=8.0" "scikit-learn==1.9.1" "pyyaml>=6.0" "feedparser>=6.0.11"

      - name: Trading-day gate
        id: gate
        run: python scripts/premarket_trading_day_gate.py

      - name: Gate and price-refresh tests
        run: |
          set -eu
          python -m pytest -q \
            tests/test_premarket_trading_day_gate.py \
            tests/test_premarket_workflow_smoke.py \
            tests/test_unofficial_numerics.py

      - name: CPU model and after-close contract tests
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -eu
          python -m pytest -q \
            tests/test_bc_cpu.py \
            tests/test_bc_cpu_afterclose.py \
            tests/test_bc_morning.py \
            tests/test_bc_morning_acquisition.py \
            tests/test_morning_model_a_clock.py \
            tests/test_model_b_close.py \
            tests/test_model_c_extreme.py \
            -k 'not full_cpu_run and not full_cpu_morning_run'

      - name: Measure full CPU forecast path
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set +e
          /usr/bin/time -o "$RUNNER_TEMP/bc-cpu-timing.txt" \
            -f 'Elapsed: %e seconds\nPeak RSS: %M KiB\nExit status: %x' \
            timeout --kill-after=5s 60s \
            python -m pytest -q tests/test_bc_cpu_afterclose.py -k full_cpu_run
          status=$?
          {
            echo '### CPU full-path smoke (60-second limit)'
            echo '```'
            cat "$RUNNER_TEMP/bc-cpu-timing.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Measure full morning CPU forecast path
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set +e
          /usr/bin/time -o "$RUNNER_TEMP/bc-morning-timing.txt" \
            -f 'Elapsed: %e seconds\nPeak RSS: %M KiB\nExit status: %x' \
            timeout --kill-after=5s 60s \
            python -m pytest -q tests/test_bc_cpu_afterclose.py -k full_cpu_morning_run
          status=$?
          {
            echo '### CPU morning full-path smoke (60-second limit)'
            echo '```'
            cat "$RUNNER_TEMP/bc-morning-timing.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
