name: Morning research forecast

on:
  schedule:
    # Monday–Saturday 08:00 KST, including Friday's closes on Saturday.
    - cron: "0 23 * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Actual-clock operation; validate never publishes a forecast
        type: choice
        default: validate
        options: [validate, morning, postclose, daily, prepare, predict, latest]
      indicators_only:
        description: Run only the market indicator checks in validate mode
        type: boolean
        default: false
      replay_chart_inputs:
        description: Check published model inputs against the issuing run's encrypted cache in validate mode
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: premarket-research-forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: github.ref == 'refs/heads/master' || inputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'prepare' && 6 || (inputs.mode == 'validate' && inputs.indicators_only && !inputs.replay_chart_inputs) && 4 || inputs.mode == 'validate' && 10 || 25 }}
    permissions:
      contents: write
      actions: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name == 'master' && 'master' || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Resolve actual-clock operation
        id: operation
        run: python scripts/accuracy_operation.py --phase gate --mode "${{ inputs.mode || 'auto' }}" --schedule "${{ github.event.schedule }}"
      - name: Install forecast and verification stack
        if: steps.operation.outputs.allowed == 'true'
        run: python -m pip install -e '.[forecast,dev]' 'scikit-learn==1.9.1'
      - name: Verify premarket gate and refresh contracts
        if: steps.operation.outputs.allowed == 'true'
        run: python -m pytest -q tests/test_premarket_trading_day_gate.py tests/test_premarket_workflow_smoke.py tests/test_postclose_protocol.py tests/test_index_constituents.py
      - name: Restore authenticated private cache
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate'
        uses: actions/cache/restore@v4
        with:
          path: .forecast-cache/state.enc
          key: accuracy-private-v1-${{ steps.operation.outputs.kst_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: accuracy-private-v1-
      - name: Open private cache
        id: cache_open
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate'
        env:
          FORECAST_CACHE_KEY: ${{ secrets.FORECAST_CACHE_KEY }}
        run: python scripts/accuracy_operation.py --phase cache-open --mode "${{ steps.operation.outputs.mode }}"
      - name: Collect bounded market indicators
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 1
        continue-on-error: true
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/collect_market_indicators.py --output-dir docs/data --sqlite data/processed/robo_session_inputs.sqlite
      - name: Collect bounded official economic facts
        if: steps.operation.outputs.collect == 'true'
        run: python scripts/collect_economic_calendar.py
      - name: Collect unofficial market numerics
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/collect_unofficial_numerics.py --output docs/data/unofficial_numerics.json
      - name: Collect index constituent snapshots
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/collect_index_constituents.py
      - name: Collect KOSPI investor flow chart
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 2
        continue-on-error: true
        # The runner's sqlite never holds investor_flow history, so the committed JSON is
        # the seed: new Naver sessions are merged in and a failure leaves the file untouched.
        run: python scripts/collect_kospi_investor_flow_chart.py --output docs/data/kospi_investor_flow_chart.json
      - name: Collect SKHY and KORU closing prices
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 1
        continue-on-error: true
        run: python scripts/export_overseas_market_prices.py --output docs/data/overseas-market-prices.json
      - name: Collect SK hynix investor-class flows
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 1
        continue-on-error: true
        run: python scripts/export_sk_hynix_investor_flow.py --output docs/data/sk-hynix-investor-flow.json
      - name: Collect Samsung Electronics investor-class flows
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 1
        continue-on-error: true
        run: python scripts/export_sk_hynix_investor_flow.py --symbol 005930 --output docs/data/samsung-electronics-investor-flow.json
      - name: Refresh exact Korean benchmark observations
        if: steps.operation.outputs.mode == 'morning' && steps.operation.outputs.collect == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/run_benchmark_forecasts.py collect
      - name: Refresh prices
        id: refresh
        if: steps.operation.outputs.collect == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.operation.outputs.mode }}" = morning ]; then
            python scripts/run_postclose_prices.py --morning | tee "$RUNNER_TEMP/prices.json"
          elif [ "${{ steps.operation.outputs.frozen_forecast }}" = true ]; then
            python scripts/run_postclose_prices.py | tee "$RUNNER_TEMP/prices.json"
          else
            python scripts/refresh_premarket_prices.py | tee "$RUNNER_TEMP/prices.json"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'], 'prices.json').read_text().splitlines()[-1])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"sqlite={data['sqlite']}\nus_csv={data['us_csv']}\n")
          PY
      - name: Collect applied model inputs
        if: steps.operation.outputs.collect == 'true' && steps.refresh.outcome == 'success'
        timeout-minutes: 6
        continue-on-error: true
        run: python scripts/collect_applied_model_inputs.py --sqlite "${{ steps.refresh.outputs.sqlite }}"
      - name: Freeze actual preparation inputs
        id: freeze
        if: steps.operation.outputs.collect == 'true' && (steps.operation.outputs.frozen_forecast != 'true' || steps.cache_open.outputs.cache_ready == 'true')
        run: python scripts/accuracy_operation.py --phase freeze --mode "${{ steps.operation.outputs.mode }}" --sqlite "${{ steps.refresh.outputs.sqlite }}" --us-csv "${{ steps.refresh.outputs.us_csv }}"
      - name: Seal preparation checkpoint before waiting
        id: checkpoint
        if: (steps.operation.outputs.mode == 'daily' || steps.operation.outputs.frozen_forecast == 'true') && steps.freeze.outputs.status == 'prepared'
        env:
          FORECAST_CACHE_KEY: ${{ secrets.FORECAST_CACHE_KEY }}
        run: python scripts/accuracy_operation.py --phase cache-seal --mode "${{ steps.operation.outputs.mode }}"
      - name: Save encrypted preparation checkpoint
        if: steps.checkpoint.outputs.status == 'sealed'
        uses: actions/cache/save@v4
        with:
          path: .forecast-cache/state.enc
          key: accuracy-private-v1-${{ steps.operation.outputs.kst_date }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
      - name: Wait for actual08:00 cutoff
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode == 'daily'
        run: python scripts/accuracy_operation.py --phase wait --mode daily
      - name: Resolve immutable forecast inputs
        id: prices
        if: steps.operation.outputs.forecast_requested == 'true' && (steps.operation.outputs.frozen_forecast != 'true' || steps.checkpoint.outputs.status == 'sealed')
        run: python scripts/accuracy_operation.py --phase inputs --mode "${{ steps.operation.outputs.mode }}" --sqlite "${{ steps.refresh.outputs.sqlite }}" --us-csv "${{ steps.refresh.outputs.us_csv }}"
      - name: Forecast Model B and conditionally Model C on CPU
        id: bc_cpu
        if: steps.operation.outputs.frozen_forecast == 'true' && steps.prices.outputs.status == 'ready'
        continue-on-error: true
        timeout-minutes: 1
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: python scripts/run_bc_cpu_afterclose.py --prepared-manifest "${{ steps.prices.outputs.prepared_manifest }}" --operation-mode "${{ steps.operation.outputs.mode }}"
      - name: Forecast KOSPI 200 and KOSDAQ 150 before the Korean open
        if: steps.operation.outputs.mode == 'morning' && steps.operation.outputs.allowed == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          BENCHMARK_US_CSV: ${{ steps.refresh.outputs.us_csv }}
        run: python scripts/run_benchmark_forecasts.py predict --confirm-public --us-csv "$BENCHMARK_US_CSV"
      - name: Korea research forecast
        id: kr_forecast
        continue-on-error: ${{ steps.operation.outputs.frozen_forecast == 'true' }}
        if: steps.prices.outputs.kr == 'true'
        run: |
          set -euo pipefail
          python scripts/run_reliable_index_forecast.py \
            --sqlite "${{ steps.prices.outputs.sqlite }}" \
            --us-observations "${{ steps.prices.outputs.us_csv }}" \
            --prepared-manifest "${{ steps.prices.outputs.prepared_manifest }}" \
            --issuance-protocol "${{ steps.prices.outputs.issuance_protocol }}" \
            --markets "${{ steps.prices.outputs.markets }}" \
            --economic-sqlite "${{ steps.prices.outputs.economic_sqlite }}" \
            --fit-state-dir "${{ steps.prices.outputs.fit_models_kr }}" | tee "$RUNNER_TEMP/korea-forecast.json"
          python scripts/verify_automation_publication.py \
            --result "$RUNNER_TEMP/korea-forecast.json" --data-dir docs/data
      - name: US research forecast
        id: us_forecast
        continue-on-error: ${{ steps.operation.outputs.frozen_forecast == 'true' }}
        if: steps.prices.outputs.us == 'true'
        run: |
          set -euo pipefail
          python scripts/run_us_index_forecast.py \
            --us-observations "${{ steps.prices.outputs.us_csv }}" \
            --prepared-manifest "${{ steps.prices.outputs.prepared_manifest }}" \
            --issuance-protocol "${{ steps.prices.outputs.issuance_protocol }}" \
            --markets "${{ steps.prices.outputs.markets }}" \
            --economic-sqlite "${{ steps.prices.outputs.economic_sqlite }}" \
            --fit-state-dir "${{ steps.prices.outputs.fit_models_us }}" | tee "$RUNNER_TEMP/us-forecast.json"
          python scripts/verify_automation_publication.py \
            --result "$RUNNER_TEMP/us-forecast.json" --data-dir docs/data/us
      - name: Persist derived model state from prepared inputs
        if: (steps.operation.outputs.mode == 'predict' || steps.operation.outputs.mode == 'daily' || steps.operation.outputs.frozen_forecast == 'true') && steps.prices.outputs.status == 'ready' && success()
        run: python scripts/accuracy_operation.py --phase publish-models --mode "${{ steps.operation.outputs.mode }}"
      - name: Refresh public market chart history
        if: steps.operation.outputs.collect == 'true' && steps.refresh.outcome == 'success'
        timeout-minutes: 2
        continue-on-error: true
        env:
          CHART_SQLITE: ${{ steps.refresh.outputs.sqlite }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/collect_market_chart_history.py --sqlite "$CHART_SQLITE" --output docs/data/market-chart-history.json
      - name: Seal private cache
        id: seal
        if: (steps.operation.outputs.collect == 'true' || (steps.operation.outputs.mode == 'daily' && steps.prices.outputs.status == 'ready')) && success() && (steps.operation.outputs.frozen_forecast != 'true' || steps.cache_open.outputs.cache_ready == 'true')
        env:
          FORECAST_CACHE_KEY: ${{ secrets.FORECAST_CACHE_KEY }}
        run: python scripts/accuracy_operation.py --phase cache-seal --mode "${{ steps.operation.outputs.mode }}"
      - name: Save encrypted final state and history
        if: steps.seal.outputs.status == 'sealed'
        uses: actions/cache/save@v4
        with:
          path: .forecast-cache/state.enc
          key: accuracy-private-v1-${{ steps.operation.outputs.kst_date }}-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Validate market indicator contracts
        if: steps.operation.outputs.mode == 'validate'
        run: python -m pytest -q tests/test_market_indicators.py tests/test_official_yields.py tests/test_official_credit.py tests/test_market_indicators_workflow.py
      - name: Smoke test market charts and model input export
        if: steps.operation.outputs.mode == 'validate' && !cancelled()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_market_chart_history.py tests/test_market_chart_macro.py tests/test_market_chart_credit.py tests/test_market_chart_model_inputs.py tests/test_market_chart_workflow.py
          npm install --prefix "$RUNNER_TEMP/chart-browser" --no-audit --no-fund --ignore-scripts playwright-core@1.65.1
          NODE_PATH="$RUNNER_TEMP/chart-browser/node_modules" node tests/market_data_explorer_ui.test.cjs
          mkdir -p "$RUNNER_TEMP/chart-smoke" "$RUNNER_TEMP/chart-smoke-private"
          python scripts/collect_market_chart_history.py --sqlite "$RUNNER_TEMP/chart-smoke-private/history.sqlite" --seed docs/data/market-chart-history.json --public-dir docs/data --output "$RUNNER_TEMP/chart-smoke/market-chart-history.json"
          python scripts/export_market_chart_model_inputs.py --output "$RUNNER_TEMP/chart-smoke/market-chart-model-inputs.json"
      - name: Resolve issuing workflow for chart replay
        id: chart_issue
        if: steps.operation.outputs.mode == 'validate' && inputs.replay_chart_inputs && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(jq -er '.run_id | tostring | select(test("^[0-9]+$"))' docs/data/model_b_forecast.json)
          day=$(jq -er '.run_date | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' docs/data/model_b_forecast.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/chart-issue.json"
          jq -e '.head_branch == "master" and .path == ".github/workflows/premarket-research-forecast.yml"' "$RUNNER_TEMP/chart-issue.json"
          sha=$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' "$RUNNER_TEMP/chart-issue.json")
          attempt=$(jq -er '.run_attempt | numbers' "$RUNNER_TEMP/chart-issue.json")
          echo "cache_key=accuracy-private-v1-$day-$run_id-$attempt-prepared" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --depth=1 origin "$sha"
          git worktree add --detach "$RUNNER_TEMP/chart-issuer" "$sha"
      - name: Restore issuing snapshot for read-only chart replay
        if: steps.chart_issue.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .forecast-cache/state.enc
          key: ${{ steps.chart_issue.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Verify input values against the original model code
        if: steps.chart_issue.outcome == 'success'
        env:
          FORECAST_CACHE_KEY: ${{ secrets.FORECAST_CACHE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from roboquant.index_forecast.automation_state import open_private_cache
          tmp = Path(os.environ['RUNNER_TEMP'])
          private = tmp / 'chart-private'
          open_private_cache('.forecast-cache/state.enc', private, key=os.environ['FORECAST_CACHE_KEY'])
          publication = json.loads(Path('docs/data/model_b_forecast.json').read_text())['publication_id']
          manifests = [p for p in (private / 'prepared').rglob('manifest.json')
                       if json.loads(p.read_text()).get('manifest_hash') == publication]
          if len(manifests) != 1:
              raise ValueError('Issuing manifest missing or ambiguous')
          (tmp / 'chart-manifest-path').write_text(str(manifests[0]))
          PY
          unset FORECAST_CACHE_KEY
          mkdir -p "$RUNNER_TEMP/chart-issuer/tools" "$RUNNER_TEMP/chart-replay"
          cp scripts/export_market_chart_model_inputs.py "$RUNNER_TEMP/chart-issuer/tools/"
          python "$RUNNER_TEMP/chart-issuer/tools/export_market_chart_model_inputs.py" --replay-completed --prepared-manifest "$(cat "$RUNNER_TEMP/chart-manifest-path")" --data-dir "$PWD/docs/data" --output "$RUNNER_TEMP/chart-replay/market-chart-model-inputs.json"
          jq -e '[.models[] | select(.key == "B" and .issue_stage == "premarket") | [.rows[] | select(.availability == "reconstructed" and .value != null)] | length > 0] | length > 0 and all' "$RUNNER_TEMP/chart-replay/market-chart-model-inputs.json"
      - name: Upload verified public chart inputs
        if: steps.chart_issue.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: issued-market-chart-inputs
          path: ${{ runner.temp }}/chart-replay/market-chart-model-inputs.json
          if-no-files-found: error
          retention-days: 3
      - name: Validate market indicators without publication
        if: steps.operation.outputs.mode == 'validate'
        timeout-minutes: 1
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python scripts/collect_market_indicators.py \
            --output-dir "$RUNNER_TEMP/market-indicators-validation" \
            --sqlite "$RUNNER_TEMP/market-indicators-private/indicators.sqlite" \
            --seed-dir docs/data
      - name: Validate KOSPI investor flow chart without publication
        # Independent of the contract tests above: a stale unrelated test must not hide this check.
        if: steps.operation.outputs.mode == 'validate' && !cancelled()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kospi-flow-validation"
          python scripts/collect_kospi_investor_flow_chart.py \
            --seed docs/data/kospi_investor_flow_chart.json \
            --output "$RUNNER_TEMP/kospi-flow-validation/kospi_investor_flow_chart.json" \
            --raw-dir "$RUNNER_TEMP/kospi-flow-validation/raw" | tee "$RUNNER_TEMP/kospi-flow-validation/summary.json"
      - name: Validate overseas charts without publication
        if: steps.operation.outputs.mode == 'validate'
        run: python -m pytest -q tests/test_overseas_market_prices.py tests/test_sk_hynix_investor_flow.py tests/test_overseas_institutional_holdings.py
      - name: Validate CFD refresh without publication
        if: steps.operation.outputs.mode == 'validate'
        run: python -m pytest -q tests/test_cfd_research.py tests/test_cfd_daily_refresh.py tests/test_frees_is_cfd.py
      - name: Validate without publication
        if: steps.operation.outputs.mode == 'validate' && !inputs.indicators_only
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_reliable_accuracy_protocol.py tests/test_reliable_intervals.py tests/test_economic_calendar.py tests/test_economic_sources.py tests/test_economic_forecast.py tests/test_forward_ledger.py tests/test_accuracy_automation.py tests/test_accuracy_calendar_audit.py tests/test_automation_publication.py tests/test_automation_cli_integration.py tests/test_pages_artifact_wait.py tests/test_postclose_protocol.py tests/test_postclose_review_fixes.py tests/test_market_closes.py tests/test_postclose_ui.py tests/test_ci_hermetic.py tests/test_runner_model_boundary.py
          python scripts/collect_economic_calendar.py --output-dir "$RUNNER_TEMP/calendar-validation" --private-dir "$RUNNER_TEMP/calendar-private"
          cp "$RUNNER_TEMP/calendar-validation/economic_collection_status.json" "$RUNNER_TEMP/accuracy-validation.json"
      - name: Upload compact validation status
        if: steps.operation.outputs.mode == 'validate' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-validation-status
          path: |
            ${{ runner.temp }}/accuracy-validation.json
            ${{ runner.temp }}/market-indicators-validation/market_indicators_status.json
            ${{ runner.temp }}/kospi-flow-validation/kospi_investor_flow_chart.json
            ${{ runner.temp }}/kospi-flow-validation/summary.json
            ${{ runner.temp }}/kospi-flow-validation/raw/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Compress derived OOF evidence
        if: (steps.prices.outputs.kr == 'true' || steps.prices.outputs.us == 'true') && !cancelled()
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          files = [p for base in ('docs/data/archive', 'docs/data/us/archive') for p in Path(base).glob('*.json')]
          if files:
              with zipfile.ZipFile('reliable-forecast-archives.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                  for path in files:
                      archive.write(path, path.as_posix())
          PY
      - name: Upload derived OOF evidence
        if: (steps.prices.outputs.kr == 'true' || steps.prices.outputs.us == 'true') && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: reliable-forecast-archives
          path: reliable-forecast-archives.zip
          retention-days: 14
          if-no-files-found: warn
      - name: Record operational state
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate' && success()
        run: python scripts/accuracy_operation.py --phase status --mode "${{ steps.operation.outputs.mode }}" --kr-outcome "${{ steps.kr_forecast.outcome }}" --us-outcome "${{ steps.us_forecast.outcome }}" --reason "${{ steps.prices.outputs.reason || 'completed' }}"
      - name: Export market chart model inputs from the issued run
        if: steps.prices.outputs.status == 'ready'
        timeout-minutes: 1
        continue-on-error: true
        env:
          PREPARED_MANIFEST: ${{ steps.prices.outputs.prepared_manifest }}
        run: python scripts/export_market_chart_model_inputs.py --prepared-manifest "$PREPARED_MANIFEST" --output docs/data/market-chart-model-inputs.json
      - name: Refresh CFD charts for Pages
        if: steps.operation.outputs.collect == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/refresh_cfd_dashboard.py --output-dir docs/data --publish-approved-aggregates
      - name: Export native market indicator catalog
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate' && success()
        timeout-minutes: 1
        continue-on-error: true
        run: python scripts/export_market_indicator_catalog.py --data-dir docs/data
      - name: Commit reviewed public payloads
        id: publish
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate' && success()
        run: |
          set -euo pipefail
          reviewed_paths=$(python scripts/accuracy_operation.py --phase public-paths --mode "${{ steps.operation.outputs.mode }}")
          if [[ -z "$reviewed_paths" ]]; then exit 0; fi
          mapfile -t files <<< "$reviewed_paths"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          git add -- "${files[@]}"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from roboquant.index_forecast.automation_state import public_payload_paths
          allowed = {p.as_posix() for p in public_payload_paths(Path('docs/data'))}
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not staged.issubset(allowed):
              raise SystemExit('staged path outside reviewed public allowlist')
          PY
          if git diff --cached --quiet; then
            if [[ "${{ steps.bc_cpu.outputs.redeploy }}" == "true" ]]; then echo 'published=true' >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified forecast context and economic calendar observations.'
          bash scripts/push_forecast_commit.sh
          echo 'published=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: forecast
    if: needs.forecast.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published default branch
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Stage only tracked reviewed Pages files and native chart database
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/stage_market_indicator_pages.py --output-dir _site --previous-base-url "$PAGES_BASE_URL/data"
      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact
        uses: ./.github/actions/wait-for-pages-artifact
        with:
          artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
