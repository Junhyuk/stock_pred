name: Premarket research forecast

on:
  schedule:
    # KST Monday–Saturday: prepare07:50, final08:00; KST Sunday excluded.
    - cron: "50 22 * * 0-5"
    - cron: "0 23 * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Actual-clock operation; validate never publishes a forecast
        type: choice
        default: validate
        options: [validate, prepare, predict, latest]

permissions:
  contents: read
concurrency:
  group: premarket-research-forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: github.ref == 'refs/heads/master' || inputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.mode == 'prepare' || github.event.schedule == '50 22 * * 0-5') && 6 || inputs.mode == 'validate' && 10 || 25 }}
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Resolve actual-clock operation
        id: operation
        run: python scripts/accuracy_operation.py --phase gate --mode "${{ inputs.mode || 'auto' }}" --schedule "${{ github.event.schedule }}"
      - name: Install forecast and verification stack
        if: steps.operation.outputs.allowed == 'true'
        run: python -m pip install -e '.[forecast,dev]'
      - name: Restore authenticated private cache
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate'
        uses: actions/cache/restore@v4
        with:
          path: .forecast-cache/state.enc
          key: accuracy-private-v1-${{ steps.operation.outputs.kst_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: accuracy-private-v1-
      - name: Open private cache
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate'
        env:
          FORECAST_CACHE_KEY: ${{ secrets.FORECAST_CACHE_KEY }}
        run: python scripts/accuracy_operation.py --phase cache-open --mode "${{ steps.operation.outputs.mode }}"
      - name: Collect bounded official economic facts
        if: steps.operation.outputs.collect == 'true'
        run: python scripts/collect_economic_calendar.py
      - name: Refresh prices
        id: refresh
        if: steps.operation.outputs.collect == 'true'
        run: |
          set -euo pipefail
          python scripts/refresh_premarket_prices.py | tee "$RUNNER_TEMP/prices.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'], 'prices.json').read_text().splitlines()[-1])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"sqlite={data['sqlite']}\nus_csv={data['us_csv']}\n")
          PY
      - name: Freeze actual preparation inputs
        if: steps.operation.outputs.collect == 'true'
        run: python scripts/accuracy_operation.py --phase freeze --mode "${{ steps.operation.outputs.mode }}" --sqlite "${{ steps.refresh.outputs.sqlite }}" --us-csv "${{ steps.refresh.outputs.us_csv }}"
      - name: Resolve immutable forecast inputs
        id: prices
        if: steps.operation.outputs.forecast_requested == 'true'
        run: python scripts/accuracy_operation.py --phase inputs --mode "${{ steps.operation.outputs.mode }}" --sqlite "${{ steps.refresh.outputs.sqlite }}" --us-csv "${{ steps.refresh.outputs.us_csv }}"
      - name: Korea research forecast
        if: steps.prices.outputs.kr == 'true'
        run: |
          set -euo pipefail
          python scripts/run_reliable_index_forecast.py \
            --sqlite "${{ steps.prices.outputs.sqlite }}" \
            --us-observations "${{ steps.prices.outputs.us_csv }}" \
            --prepared-manifest "${{ steps.prices.outputs.prepared_manifest }}" \
            --economic-sqlite "${{ steps.prices.outputs.economic_sqlite }}" \
            --fit-state-dir "${{ steps.prices.outputs.fit_models_kr }}" | tee "$RUNNER_TEMP/korea-forecast.json"
          python scripts/verify_automation_publication.py \
            --result "$RUNNER_TEMP/korea-forecast.json" --data-dir docs/data
      - name: US research forecast
        if: steps.prices.outputs.us == 'true'
        run: |
          set -euo pipefail
          python scripts/run_us_index_forecast.py \
            --us-observations "${{ steps.prices.outputs.us_csv }}" \
            --prepared-manifest "${{ steps.prices.outputs.prepared_manifest }}" \
            --economic-sqlite "${{ steps.prices.outputs.economic_sqlite }}" \
            --fit-state-dir "${{ steps.prices.outputs.fit_models_us }}" | tee "$RUNNER_TEMP/us-forecast.json"
          python scripts/verify_automation_publication.py \
            --result "$RUNNER_TEMP/us-forecast.json" --data-dir docs/data/us
      - name: Persist derived model state from prepared inputs
        if: steps.operation.outputs.mode == 'predict' && steps.prices.outputs.status == 'ready' && success()
        run: python scripts/accuracy_operation.py --phase publish-models --mode predict
      - name: Seal private cache
        id: seal
        if: steps.operation.outputs.collect == 'true' && success()
        env:
          FORECAST_CACHE_KEY: ${{ secrets.FORECAST_CACHE_KEY }}
        run: python scripts/accuracy_operation.py --phase cache-seal --mode "${{ steps.operation.outputs.mode }}"
      - name: Save encrypted preparation and history
        if: steps.seal.outputs.status == 'sealed'
        uses: actions/cache/save@v4
        with:
          path: .forecast-cache/state.enc
          key: accuracy-private-v1-${{ steps.operation.outputs.kst_date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate without publication
        if: steps.operation.outputs.mode == 'validate'
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_reliable_accuracy_protocol.py tests/test_reliable_intervals.py tests/test_economic_calendar.py tests/test_economic_sources.py tests/test_economic_forecast.py tests/test_forward_ledger.py tests/test_accuracy_automation.py tests/test_accuracy_calendar_audit.py tests/test_automation_publication.py tests/test_automation_cli_integration.py tests/test_pages_artifact_wait.py
          python scripts/collect_economic_calendar.py --output-dir "$RUNNER_TEMP/calendar-validation" --private-dir "$RUNNER_TEMP/calendar-private"
          cp "$RUNNER_TEMP/calendar-validation/economic_collection_status.json" "$RUNNER_TEMP/accuracy-validation.json"
      - name: Upload compact validation status
        if: steps.operation.outputs.mode == 'validate' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-validation-status
          path: ${{ runner.temp }}/accuracy-validation.json
          retention-days: 14
          if-no-files-found: warn
      - name: Compress derived OOF evidence
        if: (steps.prices.outputs.kr == 'true' || steps.prices.outputs.us == 'true') && !cancelled()
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          files = [p for base in ('docs/data/archive', 'docs/data/us/archive') for p in Path(base).glob('*.json')]
          if files:
              with zipfile.ZipFile('reliable-forecast-archives.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                  for path in files:
                      archive.write(path, path.as_posix())
          PY
      - name: Upload derived OOF evidence
        if: (steps.prices.outputs.kr == 'true' || steps.prices.outputs.us == 'true') && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: reliable-forecast-archives
          path: reliable-forecast-archives.zip
          retention-days: 14
          if-no-files-found: warn
      - name: Record operational state
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate' && success()
        run: python scripts/accuracy_operation.py --phase status --mode "${{ steps.operation.outputs.mode }}" --reason "${{ steps.prices.outputs.reason || 'completed' }}"
      - name: Commit reviewed public payloads
        id: publish
        if: steps.operation.outputs.allowed == 'true' && steps.operation.outputs.mode != 'validate' && success()
        run: |
          set -euo pipefail
          mapfile -t files < <(python scripts/accuracy_operation.py --phase public-paths)
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          git add -- "${files[@]}"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from roboquant.index_forecast.automation_state import public_payload_paths
          allowed = {p.as_posix() for p in public_payload_paths(Path('docs/data'))}
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not staged.issubset(allowed):
              raise SystemExit('staged path outside reviewed public allowlist')
          PY
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish verified forecast context and economic calendar observations.'
          git push origin HEAD:master
          echo 'published=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: forecast
    if: needs.forecast.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published default branch
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Stage only tracked reviewed Pages files
        run: |
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git', 'ls-files', 'docs'], text=True).splitlines():
              source = Path(name)
              target = Path('_site') / source.relative_to('docs')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact
        uses: ./.github/actions/wait-for-pages-artifact
        with:
          artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
