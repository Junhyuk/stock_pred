name: Premarket research forecast

on:
  schedule:
    # 22:50 UTC Sunday–Thursday is 07:50 Asia/Seoul Monday–Friday.
    - cron: "50 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premarket-research-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[global,dev]"

      - name: Trading-day gate
        id: gate
        run: python scripts/premarket_trading_day_gate.py

      - name: Refresh prices
        id: prices
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          python scripts/refresh_premarket_prices.py | tee "$RUNNER_TEMP/prices.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"], "prices.json").read_text(encoding="utf-8").splitlines()
          data = json.loads(lines[-1])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"sqlite={data['sqlite']}\n")
              stream.write(f"us_csv={data['us_csv']}\n")
          PY

      - name: Collect MarketNewsFeed metadata
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/collect_marketnewsfeed_site.py

      - name: Korea research forecast
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/run_reliable_index_forecast.py \
            --sqlite "${{ steps.prices.outputs.sqlite }}" \
            --us-observations "${{ steps.prices.outputs.us_csv }}" \
            --news-context docs/data/event_context/houthi_aramco_20261108.json

      - name: US research forecast
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/run_us_index_forecast.py \
            --us-observations "${{ steps.prices.outputs.us_csv }}" \
            --news-context docs/data/event_context/houthi_aramco_20261108.json

      - name: Upload full OOF archives
        if: steps.gate.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: reliable-forecast-archives
          path: |
            docs/data/archive/
            docs/data/us/archive/
          retention-days: 14
          if-no-files-found: warn

      - name: Commit compact Pages payloads
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          set -eu
          files=(
            docs/data/reliable_index_forecast.json
            docs/data/reliable_validation_report.json
            docs/data/reliable_model_card.json
            docs/data/reliable_publication.json
            docs/data/us/reliable_index_forecast.json
            docs/data/us/reliable_validation_report.json
            docs/data/us/reliable_model_card.json
            docs/data/us/reliable_publication.json
          )
          present=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              present+=("$file")
            fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "no compact payload files"
            exit 0
          fi
          git add -- "${present[@]}"
          python - <<'PY'
          import subprocess
          import sys
          names = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          def banned(path: str) -> bool:
              name = path.replace("\\", "/")
              if name.startswith(("data/processed/", "data/raw/")) or "/data/processed/" in name or "/data/raw/" in name:
                  return True
              if "docs/data/archive/" in name or "docs/data/us/archive/" in name:
                  return True
              base = name.rsplit("/", 1)[-1]
              if base == ".env" or base.startswith(".env") or name.endswith(".sqlite") or ".sqlite" in name or name.endswith(".duckdb") or ".duckdb" in name:
                  return True
              return False
          bad = [name for name in names if banned(name)]
          if bad:
              print("refusing to stage forbidden paths:", *bad, file=sys.stderr)
              raise SystemExit(1)
          PY
          if git diff --cached --quiet; then
            echo "compact payloads unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "$(cat <<'EOF'
          Publish the compact next-session research forecast so GitHub Pages stays current.

          EOF
          )"
          git push
