name: Premarket research forecast

on:
  schedule:
    # Every day at 07:50 Asia/Seoul; the XKRX gate controls forecast execution.
    - cron: "50 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premarket-research-forecast
  cancel-in-progress: false

jobs:
  forecast:
    # This repository's default branch is master. Update if the default branch changes.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install trading-day calendar
        run: |
          set -eu
          python -m pip install "exchange-calendars>=4.5" "pandas>=2.2" "numpy>=1.26"

      - name: Trading-day gate
        id: gate
        run: python scripts/premarket_trading_day_gate.py

      - name: Restore forecast history
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/processed/forecast-history
          key: premarket-forecast-history-${{ steps.gate.outputs.kst_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            premarket-forecast-history-

      - name: Install forecast stack
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          deps = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["optional-dependencies"]["forecast"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY

      - name: Place cached history
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          python - <<'PY'
          import shutil
          from pathlib import Path
          cache = Path("data/processed/forecast-history")
          target = Path("data/processed")
          target.mkdir(parents=True, exist_ok=True)
          if not cache.is_dir():
              raise SystemExit(0)
          sqlite = cache / "index_forecast.sqlite"
          if sqlite.is_file():
              shutil.copy2(sqlite, target / "index_forecast.sqlite")
          csvs = sorted(
              path for path in cache.glob("us_market_observations_v2_*.csv")
              if len(path.stem.removeprefix("us_market_observations_v2_")) == 8
              and path.stem.removeprefix("us_market_observations_v2_").isdigit()
          )
          if csvs:
              shutil.copy2(csvs[-1], target / csvs[-1].name)
          PY

      - name: Refresh prices
        id: prices
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python scripts/refresh_premarket_prices.py | tee "$RUNNER_TEMP/prices.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"], "prices.json").read_text(encoding="utf-8").splitlines()
          data = json.loads(lines[-1])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"sqlite={data['sqlite']}\n")
              stream.write(f"us_csv={data['us_csv']}\n")
          PY

      - name: Korea research forecast
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python scripts/run_reliable_index_forecast.py \
            --sqlite "${{ steps.prices.outputs.sqlite }}" \
            --us-observations "${{ steps.prices.outputs.us_csv }}" | tee "$RUNNER_TEMP/korea-forecast.json"
          python scripts/verify_automation_publication.py \
            --result "$RUNNER_TEMP/korea-forecast.json" --data-dir docs/data

      - name: US research forecast
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python scripts/run_us_index_forecast.py \
            --us-observations "${{ steps.prices.outputs.us_csv }}" | tee "$RUNNER_TEMP/us-forecast.json"
          python scripts/verify_automation_publication.py \
            --result "$RUNNER_TEMP/us-forecast.json" --data-dir docs/data/us

      - name: Compress OOF archives
        if: steps.gate.outputs.run == 'true' && !cancelled()
        run: |
          set -eu
          python - <<'PY'
          import zipfile
          from pathlib import Path
          roots = [Path("docs/data/archive"), Path("docs/data/us/archive")]
          files = [path for root in roots if root.is_dir() for path in root.rglob("*") if path.is_file()]
          if not files:
              print("no OOF archive files")
              raise SystemExit(0)
          destination = Path("reliable-forecast-archives.zip")
          with zipfile.ZipFile(destination, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in files:
                  archive.write(path, path.as_posix())
          print(f"zip_bytes={destination.stat().st_size} files={len(files)}")
          PY

      - name: Upload full OOF archives
        if: steps.gate.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: reliable-forecast-archives
          path: reliable-forecast-archives.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Update forecast history cache
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          set -eu
          python - <<'PY'
          import shutil
          from pathlib import Path
          source = Path("data/processed")
          cache = source / "forecast-history"
          cache.mkdir(parents=True, exist_ok=True)
          for stale in cache.glob("*"):
              if stale.is_file():
                  stale.unlink()
          sqlite = source / "index_forecast.sqlite"
          if sqlite.is_file():
              shutil.copy2(sqlite, cache / sqlite.name)
          csvs = sorted(
              path for path in source.glob("us_market_observations_v2_*.csv")
              if len(path.stem.removeprefix("us_market_observations_v2_")) == 8
              and path.stem.removeprefix("us_market_observations_v2_").isdigit()
          )
          if csvs:
              shutil.copy2(csvs[-1], cache / csvs[-1].name)
          PY

      - name: Record daily automation status
        env:
          KST_DATE: ${{ steps.gate.outputs.kst_date }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
        run: python scripts/write_automation_status.py --date "$KST_DATE" --reason "$GATE_REASON"

      - name: Commit compact Pages payloads
        id: publish
        env:
          DEFAULT_BRANCH: master
        run: |
          set -eu
          files=(
            docs/data/automation_status.json
            docs/data/reliable_index_forecast.json
            docs/data/reliable_validation_report.json
            docs/data/reliable_model_card.json
            docs/data/reliable_publication.json
            docs/data/us/reliable_index_forecast.json
            docs/data/us/reliable_validation_report.json
            docs/data/us/reliable_model_card.json
            docs/data/us/reliable_publication.json
          )
          present=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              present+=("$file")
            fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "no compact payload files"
            exit 0
          fi
          git add -- "${present[@]}"
          python - <<'PY'
          import subprocess
          import sys
          names = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          def banned(path: str) -> bool:
              name = path.replace("\\", "/")
              if name.startswith(("data/processed/", "data/raw/")) or "/data/processed/" in name or "/data/raw/" in name:
                  return True
              if "docs/data/archive/" in name or "docs/data/us/archive/" in name or name.endswith(".zip"):
                  return True
              base = name.rsplit("/", 1)[-1]
              if base == ".env" or base.startswith(".env") or name.endswith(".sqlite") or ".sqlite" in name or name.endswith(".duckdb") or ".duckdb" in name:
                  return True
              return False
          bad = [name for name in names if banned(name)]
          if bad:
              print("refusing to stage forbidden paths:", *bad, file=sys.stderr)
              raise SystemExit(1)
          PY
          if git diff --cached --quiet; then
            echo "compact payloads unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "$(cat <<'EOF'
          Publish the compact next-session research forecast so GitHub Pages stays current.

          EOF
          )"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: forecast
    if: needs.forecast.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published default branch
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
