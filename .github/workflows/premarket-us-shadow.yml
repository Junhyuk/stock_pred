name: Premarket US shadow forward check

# Research-only forward cohort premarket_us_shadow_v1 (configs/probability_shadow.yaml).
# Inputs are collected before the 08:00 KST cutoff; the KOSPI/KOSDAQ shadow p_up is
# issued at or after 08:00 and before the XKRX open. production_weight stays 0.
# Nothing under docs/ is written, so Pages is not redeployed.
on:
  schedule:
    # KST Monday–Friday 07:35, with a 07:50 fallback if the first run is delayed
    # or dropped. A second run skips a market already issued for the same target.
    - cron: "35 22 * * 0-4"
    - cron: "50 22 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        description: smoke = labelled rehearsal into an artifact only; live = actual-clock cohort run
        type: choice
        default: smoke
        options: [smoke, live]

permissions:
  contents: read

concurrency:
  group: premarket-us-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install forecast stack
        run: python -m pip install -e '.[forecast,dev]'
      - name: Trading-day gate
        id: gate
        run: python scripts/premarket_trading_day_gate.py
      - name: Decide whether to run
        id: plan
        run: |
          if [ "$MODE" = smoke ] || [ "${{ steps.gate.outputs.run }}" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not an XKRX session (${{ steps.gate.outputs.reason }}); live shadow skipped."
          fi
      - name: Shadow contract tests
        if: steps.plan.outputs.run == 'true'
        run: python -m pytest -q tests/test_probability_research.py tests/test_premarket_us_shadow_ops.py
      - name: Collect inputs before the 08:00 cutoff
        id: inputs
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/shadow"
          mkdir -p "$work"
          python scripts/refresh_premarket_prices.py --sqlite "$work/index_forecast.sqlite" --output-dir "$work" | tee "$work/prices.json"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"], "shadow")
          data = json.loads((work / "prices.json").read_text().splitlines()[-1])
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"sqlite={data['sqlite']}\nus_csv={data['us_csv']}\n")
          print("inputs collected at", datetime.now(timezone.utc).isoformat())
          PY
      - name: Wait for the actual 08:00 KST cutoff
        if: steps.plan.outputs.run == 'true' && env.MODE == 'live'
        timeout-minutes: 30
        run: |
          python - <<'PY'
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          # 30 s margin so a slightly slow runner clock still issues at premarket_final.
          cutoff = now.replace(hour=8, minute=0, second=30, microsecond=0)
          wait = (cutoff - now).total_seconds()
          if 0 < wait <= 1800:
              print(f"waiting {wait:.0f}s for {cutoff.isoformat()}")
              time.sleep(wait)
          else:
              print(f"no wait (now {now.isoformat()}); the shadow applies its own window gate")
          PY
      - name: Shadow forecast
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          args=(--sqlite "${{ steps.inputs.outputs.sqlite }}" --us-observations "${{ steps.inputs.outputs.us_csv }}"
                --run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA")
          if [ "$MODE" = live ]; then
            python scripts/run_probability_research.py shadow "${args[@]}" | tee "$RUNNER_TEMP/shadow/shadow.jsonl"
          else
            python scripts/run_probability_research.py shadow "${args[@]}" --rehearsal \
              --ledger "$RUNNER_TEMP/shadow/rehearsal-ledger.jsonl" | tee "$RUNNER_TEMP/shadow/shadow.jsonl"
          fi
      - name: Score matured forward forecasts
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ "$MODE" = live ]; then
            python scripts/run_probability_research.py evaluate --sqlite "${{ steps.inputs.outputs.sqlite }}"
            cp research/premarket_us_shadow/summary.json "$RUNNER_TEMP/shadow/summary.json"
          else
            python scripts/run_probability_research.py evaluate --sqlite "${{ steps.inputs.outputs.sqlite }}" \
              --output "$RUNNER_TEMP/shadow/summary.json"
          fi
      - name: Upload run evidence
        if: steps.plan.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-us-shadow-${{ env.MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shadow/*.json
            ${{ runner.temp }}/shadow/*.jsonl
            ${{ runner.temp }}/shadow/*.csv
          retention-days: 14
          if-no-files-found: warn
      - name: Commit the forward-cohort ledger
        if: steps.plan.outputs.run == 'true' && env.MODE == 'live' && success()
        run: |
          set -euo pipefail
          # Identity for both the commit and any rebase in the push retry loop.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ledger=research/premarket_us_shadow/ledger.jsonl
          summary=research/premarket_us_shadow/summary.json
          # The summary is derived from the ledger; without new ledger rows (e.g. the
          # 07:50 fallback skipping already-issued markets) there is nothing to record.
          if [ ! -e "$ledger" ] || { git ls-files --error-unmatch "$ledger" >/dev/null 2>&1 && git diff --quiet -- "$ledger"; }; then
            echo "no new ledger rows; nothing to commit"
            exit 0
          fi
          allowed="$ledger $summary"
          git add -- $(for f in $allowed; do [ -e "$f" ] && echo "$f"; done)
          staged=$(git diff --cached --name-only)
          for f in $staged; do
            case " $allowed " in *" $f "*) ;; *) echo "staged path outside allowlist: $f"; exit 1;; esac
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m 'Record premarket US shadow forecasts for the forward check.'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git pull --rebase origin master
          done
          exit 1
