<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한국·미국 다음 거래일 확률·예측구간 연구</title>
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .notice {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 16px 0;
      line-height: 1.55;
      font-size: 14px;
      color: var(--ink);
    }
    #status {
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    @media (max-width: 800px) {
      .forecast-grid { grid-template-columns: 1fr; }
    }
    .forecast-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .forecast-card h2 {
      font-size: 22px;
      margin: 0;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .card-dates {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .card-dates strong { color: var(--ink); font-weight: 700; }
    .hero-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .hero-metric {
      padding: 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--line);
    }
    .hero-metric span {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .hero-metric strong {
      display: block;
      font-size: 26px;
      line-height: 1.15;
      color: var(--teal);
      font-weight: 800;
    }
    .prob-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .prob-box {
      text-align: center;
      padding: 14px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .prob-box.up { background: var(--green-bg); }
    .prob-box.down { background: #fff0ed; }
    .prob-box span {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .prob-box strong {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
    }
    .prob-box.up strong { color: var(--teal); }
    .prob-box.down strong { color: var(--red); }
  .detail-line {
      font-size: 15px;
      line-height: 1.5;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .detail-line span { color: var(--muted); font-weight: 700; }
    .detail-line strong { color: var(--ink); font-weight: 800; }
    .card-status {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: auto;
    }
    .card-status.ok { background: var(--green-bg); color: var(--teal); }
    .card-status.warn { background: var(--amber-bg); color: var(--amber); }
    .card-status.blocked { background: #f0f2f5; color: var(--muted); }
    .empty-state {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }
  </style>
</head>
<body>
<main>
  <header class="topbar">
    <div>
      <p class="eyebrow">1D · 연구 전용 · production_weight=0</p>
      <h1>한국·미국 다음 거래일 확률·예측구간</h1>
    </div>
    <a href="index-forecast.html">1D/2D 리포트</a>
  </header>
  <p class="notice">상승 확률은 P(다음 거래일 수익률 &gt; 0)입니다. 하락 확률은 1−상승 확률이며 보합은 별도 추정하지 않습니다.
    80% 구간은 과거 시점 외 표본 오차로 보정한 목표 구간이며, 시간 의존성으로 실제 포함률을 보장하지 않습니다.
    검증을 통과하지 못한 결과는 매매 신호가 아닙니다.</p>
  <div id="status" role="status">로컬 연구 결과를 읽는 중입니다.</div>
  <div id="content"></div>
</main>
<script>
const MARKET_LABELS = {
  KOSPI: 'KOSPI',
  KOSDAQ: 'KOSDAQ',
  US_SPX: 'S&P 500',
  US_NASDAQ: 'Nasdaq',
};

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

const pct = value => {
  if (value == null || value === '') return '—';
  const n = Number(value);
  if (Number.isNaN(n)) return '—';
  return (n * 100).toFixed(2) + '%';
};

const probLabel = value => {
  if (value == null || value === '') return '확률 없음';
  const n = Number(value);
  if (Number.isNaN(n)) return '확률 없음';
  return (n * 100).toFixed(2) + '%';
};

const level = value => {
  if (value == null || value === '') return '—';
  const n = Number(value);
  if (Number.isNaN(n)) return '—';
  return n.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
};

function forecastStatusMessage(status) {
  const s = String(status ?? '');
  if (s.startsWith('blocked_')) {
    return { text: '종가가 최신 거래일까지 아니라 오늘 예측을 내지 않음', kind: 'blocked' };
  }
  if (s === 'accepted_shadow' || s === 'accepted' || s === 'research_only') {
    return { text: '연구 결과', kind: 'ok' };
  }
  if (s === 'rejected' || s === 'not_ready') {
    return { text: '검증 미통과 · 매매 신호 아님', kind: 'warn' };
  }
  return { text: '검증 미통과 · 매매 신호 아님', kind: 'warn' };
}

function renderCard(item, runStatus) {
  const f = item.forecast ?? {};
  const c = item.context ?? {};
  const marketName = MARKET_LABELS[item.market] ?? item.market;
  const fs = String(f.status ?? '');
  const rs = String(runStatus ?? '');
  const statusForMessage = fs.startsWith('blocked_') ? fs : (rs.startsWith('blocked_') ? rs : fs);
  const statusInfo = forecastStatusMessage(statusForMessage);
  const blocked = String(runStatus).startsWith('blocked_') || String(f.status ?? '').startsWith('blocked_');
  const showNumbers = runStatus !== 'unpublished' && !blocked;

  const latestClose = showNumbers ? level(f.latest_close) : '—';
  const expectedIndex = showNumbers ? level(f.expected_index) : '—';
  const pUp = showNumbers ? probLabel(f.p_up) : '확률 없음';
  const pDown = showNumbers ? probLabel(f.p_down) : '확률 없음';
  const expRet = showNumbers ? pct(f.expected_return) : '—';
  const idxLo = showNumbers ? level(f.index_range_low) : '—';
  const idxHi = showNumbers ? level(f.index_range_high) : '—';
  const rangeText = (idxLo === '—' && idxHi === '—') ? '—' : `${idxLo} ~ ${idxHi}`;

  return `<article class="forecast-card">
    <h2>${escapeHtml(marketName)}</h2>
    <div class="card-dates">
      <div><strong>기준 종가일</strong> ${escapeHtml(c.asof_date ?? '—')}</div>
      <div><strong>다음 거래일</strong> ${escapeHtml(c.target_date ?? '—')}</div>
    </div>
    <div class="hero-metrics">
      <div class="hero-metric"><span>최근 종가</span><strong>${escapeHtml(latestClose)}</strong></div>
      <div class="hero-metric"><span>예상 지수</span><strong>${escapeHtml(expectedIndex)}</strong></div>
    </div>
    <div class="prob-row">
      <div class="prob-box up"><span>상승 확률</span><strong>${escapeHtml(pUp)}</strong></div>
      <div class="prob-box down"><span>하락 확률</span><strong>${escapeHtml(pDown)}</strong></div>
    </div>
    <div class="detail-line"><span>예상 수익률 </span><strong>${escapeHtml(expRet)}</strong></div>
    <div class="detail-line"><span>80% 지수 구간 </span><strong>${escapeHtml(rangeText)}</strong></div>
    <p class="card-status ${escapeHtml(statusInfo.kind)}">${escapeHtml(statusInfo.text)}</p>
  </article>`;
}

async function loadPublishedRun(base = 'data') {
  const response = await fetch(`${base}/reliable_index_forecast.json`, { cache: 'no-store' });
  if (!response.ok) throw Error('연구 결과 파일 없음');
  const raw = await response.text();
  const run = JSON.parse(raw);
  if (String(run.status).startsWith('blocked_')) return run;
  const publication = await fetch(`${base}/reliable_publication.json`, { cache: 'no-store' });
  if (!publication.ok) {
    return { ...run, status: 'unpublished', issued_at: null, markets: [] };
  }
  const manifest = await publication.json();
  const digest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw))))
    .map(v => v.toString(16).padStart(2, '0')).join('');
  if (
    manifest.schema_version !== 'reliable_publication_v1' ||
    manifest.run_id !== run.run_id ||
    manifest.payload_checksums?.['reliable_index_forecast.json'] !== digest ||
    !manifest.publication_checked_at
  ) {
    return { ...run, status: 'unpublished', issued_at: null, markets: [] };
  }
  run.status = 'research_only';
  run.issued_at = manifest.publication_checked_at;
  run.publication = manifest;
  (run.markets ?? []).forEach(item => {
    if (item.context) item.context.issued_at = run.issued_at;
    if (item.forecast) item.forecast.issued_at = run.issued_at;
  });
  return run;
}

function cardsFromRun(run) {
  const markets = run.markets ?? [];
  if (markets.length) return markets.map(item => ({ item, runStatus: run.status }));
  return Object.entries(run.contexts ?? {}).map(([market, context]) => ({
    item: { market, context, forecast: { status: run.status } },
    runStatus: run.status,
  }));
}

Promise.all([
  loadPublishedRun(),
  loadPublishedRun('data/us').catch(() => null),
]).then(results => {
  const runs = results.filter(Boolean);
  const markets = runs.flatMap(cardsFromRun);

  document.getElementById('status').textContent = '';

  const content = document.getElementById('content');
  if (!markets.length) {
    const reasons = runs.flatMap(r => r.reasons ?? []).filter(Boolean);
    content.innerHTML = reasons.length
      ? `<p class="empty-state">${escapeHtml(reasons.join(' · '))}</p>`
      : '<p class="empty-state">표시할 연구 결과가 없습니다.</p>';
    return;
  }

  const order = ['KOSPI', 'KOSDAQ', 'US_SPX', 'US_NASDAQ'];
  markets.sort((a, b) => {
    const ia = order.indexOf(a.item.market);
    const ib = order.indexOf(b.item.market);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  content.innerHTML = `<div class="forecast-grid">${markets.map(({ item, runStatus }) => renderCard(item, runStatus)).join('')}</div>`;
}).catch(error => {
  document.getElementById('status').textContent = error.message;
});
</script>
</body>
</html>
