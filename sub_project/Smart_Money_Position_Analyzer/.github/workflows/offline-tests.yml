name: Smart Money Offline QA
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Initialize isolated temp DB and test
        run: |
          export PYTHONPATH=.
          python -m unittest discover -s tests -v
          python -m smartmoney --db /tmp/smartmoney_ci.sqlite init-db
          python -m smartmoney --db /tmp/smartmoney_ci.sqlite status
