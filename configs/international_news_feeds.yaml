# Metadata-only research sensor. No publisher article-body crawling.
schema_version: international_news_collection_v1
request_timeout_seconds: 15
max_response_bytes: 2097152
max_entries_per_feed: 50
feeds:
  - source: fed_press
    kind: official
    enabled: true
    url: https://www.federalreserve.gov/feeds/press_all.xml
    documentation_url: https://www.federalreserve.gov/feeds/feeds.htm
  - source: un_news
    kind: official
    enabled: true
    url: https://news.un.org/feed/subscribe/en/news/all/rss.xml
    documentation_url: https://www.un.org/uk/delegate/page/un-news-outlets
  - source: ecb_press
    kind: official
    enabled: true
    url: https://www.ecb.europa.eu/rss/press.html
    documentation_url: https://www.ecb.europa.eu/home/html/rss.pl.html
gdelt:
  enabled: true
  endpoint: https://api.gdeltproject.org/api/v2/doc/doc
  documentation_url: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
  timespan: 1d
  max_records: 25
  queries:
    - source: gdelt_geopolitics
      query: '(Iran OR Hormuz OR ceasefire OR sanctions)'
    - source: gdelt_trade
      query: '(tariff OR "export control") (Korea OR semiconductor OR China)'
    - source: gdelt_monetary
      query: '("Federal Reserve" OR "Bank of Korea") (rate OR policy)'
# Required coverage is declared before labels. RSS head retrieval alone and a
# capped GDELT result are not proof of complete historical coverage.
required_sources: [fed_press, un_news, ecb_press, gdelt_geopolitics, gdelt_trade, gdelt_monetary]
