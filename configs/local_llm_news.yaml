paths:
  database: data/processed/roboquant.duckdb
  model_dir: models/market_outlook_ml_shadow
  report_dir: reports/local_llm_news

local_llm_news:
  enabled: true
  ollama_host: http://127.0.0.1:11434
  model_name: roboquant-news:qwen3.5-27b-q4
  gguf_path: llm_models/gguf/Qwen3.5-27B-Q4_K_M.gguf
  prompt_version: local-news-v1
  request_timeout_seconds: 180
  market_open_cutoff_kst: "08:00"
  document_max_chars: 320
  batch_size: 6
  num_ctx: 4096
  max_output_tokens: 180
  thinking_mode: auto
  thinking_importance_threshold: 4
  max_thinking_probes_per_day: 4
  close_max_documents: 30
  premarket_max_documents: 12
  sources:
    marketnewsfeed_headlines: true
    market_news_feed: true
    naver_news: true
    gdelt: true
    bigkinds: true
    dart: true
  daily_brief:
    enabled: true
    max_output_tokens: 160
  base_config: configs/top50_normal.yaml

market_outlook_ml_shadow:
  enabled: true
  model_name: market-outlook-lgbm-news-shadow-v1
  horizon: TODAY
  initial_train_days: 504
  purge_days: 1
  retrain_step_days: 21
  calibration_window: 252
  min_calibration_rows: 60
  min_signal_days: 60
  min_mature_dates: 60
  target_coverage: 0.80
  coverage_lower_bound: 0.75
  coverage_upper_bound: 0.85
  max_average_width_ratio: 1.10
  max_low_breach_worsening: 0.02
  lgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 7
    min_child_samples: 60
    reg_lambda: 10.0
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    random_state: 42
