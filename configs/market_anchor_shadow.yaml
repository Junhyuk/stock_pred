base_config: top50_normal.yaml

market_anchor_shadow:
  enabled: true
  model_name: market-anchor-quantile-shadow-v1
  feature_version: market_anchor_v1
  forecast_stage: final_premarket
  source: pykrx
  start_date: "2019-01-02"
  sleep_seconds: 0.2
  kospi_anchors: ["005930", "000660", "005380"]
  kosdaq_top_n: 3
  initial_train_days: 756
  purge_days: 1
  retrain_step_days: 21
  calibration_window: 252
  min_calibration_rows: 60
  min_feature_support_rows: 60
  min_feature_support_fraction: 0.05
  target_coverage: 0.80
  coverage_lower_bound: 0.75
  coverage_upper_bound: 0.85
  max_average_width_ratio: 1.10
  max_low_breach_worsening: 0.02
  minimum_live_final_days: 60
  quantiles: [0.10, 0.50, 0.90]
  lightgbm:
    num_leaves: 7
    min_child_samples: 80
    learning_rate: 0.03
    n_estimators: 250
    reg_lambda: 10.0
    feature_fraction: 0.7
    random_state: 42
    n_jobs: 4
