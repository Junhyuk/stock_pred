# Isolated 1D research only. Existing 5D pipeline and production weights are separate.
universe:
  KOSPI: 100
  KOSDAQ: 50
participant_impact:
  # Read-only observation bridge; missing/finality/PIT gaps keep groups unavailable.
  sqlite: sub_project/Smart_Money_Position_Analyzer/data/smartmoney.sqlite
  bridge: null
us_market:
  enabled: true
  observations_path: data/processed/us_market_observations_v2.csv
  buffer_minutes: 15
  max_stale_sessions: 0
  # Frozen before new terminal results: SPX/Nasdaq/SOX 1d, VIX level/1d, SOX-Nasdaq spread.
  historical_mode: RETROSPECTIVE_END_OF_SESSION_RECONSTRUCTION
event_context:
  path: data/processed/verified_us_iran_context.json
  # Reporting context only. Quantitative news fusion is independently gated.
international_news:
  snapshot_path: data/processed/international_news_snapshot.json
  # Snapshot completeness is not historical coverage. Unknown coverage => alpha zero.
settings:
  initial_train_days: 504
  purge_days: 1
  retrain_step_days: 21
  calibration_window: 252
  min_calibration_rows: 60
  development_days: 252
  test_days: 252
  bootstrap_samples: 2000
  bootstrap_block_days: 20
  random_state: 42
  min_oos_rows: 252
  model_families: [linear, lightgbm, ensemble]
economic_calendar:
  sqlite_path: data/processed/economic-calendar/economic.sqlite
  history_path: docs/data/economic_history.json
  numeric_policy: observed_current_receipt_v1
  source_registry: configs/economic_calendar.yaml
private_state_dir: data/processed/accuracy-state
