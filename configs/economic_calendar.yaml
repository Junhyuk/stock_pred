schema_version: economic_source_registry_v1
source_policy:
  default_vintage: current_snapshot
  verified_first_release_requires_official_release_page: true
  supported_actual_values_are_observed_only_after_first_seen_at: true
  no_market_consensus: true
required_measures:
  US:
    - policy_rate_lower
    - policy_rate_upper
    - policy_rate
    - cpi_headline_mom
    - cpi_headline_yoy
    - cpi_core_mom
    - cpi_core_yoy
    - nfp_monthly_change
    - unemployment_rate
    - pce_headline_mom
    - pce_headline_yoy
    - core_pce_mom
    - core_pce_yoy
  KR:
    - policy_rate
    - cpi_headline_mom
    - cpi_headline_yoy
    - cpi_core_mom
    - cpi_core_yoy
    - employment_yoy_change
    - unemployment_rate
  JP:
    - policy_rate
    - cpi_headline_yoy
    - cpi_core_yoy
    - employment_yoy_change
    - unemployment_rate
  EA:
    - policy_rate
    - cpi_headline_yoy
    - cpi_headline_mom
    - cpi_core_yoy
    - cpi_core_mom
    - unemployment_rate
sources:
  # United States: BLS v1 is keyless but returns revised current history.
  - source_id: us_fed_current_target_range
    country: US
    kind: actual_current
    source_url: https://www.federalreserve.gov/monetarypolicy/openmarket.htm
    parser: fed_policy
    access: public_no_key
    format: html
    expected_measures: [policy_rate_lower, policy_rate_upper, policy_rate]
    definition_version: fed:current-target-range:percent
    license_note: Official Federal Reserve release; source attribution should be preserved.

  - source_id: us_fed_fomc_calendar
    country: US
    kind: schedule
    source_url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    parser: fed_schedule
    access: public_no_key
    format: html
    license_note: Official Federal Reserve calendar; meeting dates are listed without a decision clock time.

  - source_id: us_bls_cpi_headline_latest
    country: US
    kind: actual_api_current
    source_url: https://api.bls.gov/publicAPI/v1/timeseries/data/CUSR0000SA0?startyear={start_year}&endyear={end_year}
    url_year: current
    parser: bls_series
    access: public_no_key
    format: json
    series_id: CUSR0000SA0
    seasonal_adjustment: SA
    expected_measures: [cpi_headline_mom, cpi_headline_yoy]
    measure_definitions:
      cpi_headline_mom: BLS:CUSR0000SA0:SA:pct_change_mom:current_series
      cpi_headline_yoy: BLS:CUSR0000SA0:SA:pct_change_yoy:current_series
    measures:
      - measure: cpi_headline_mom
        transform: pct_change_mom
        unit: percent
      - measure: cpi_headline_yoy
        transform: pct_change_yoy
        unit: percent
    license_note: Official BLS API; current series observations can be revised.

  - source_id: us_bls_cpi_core_latest
    country: US
    kind: actual_api_current
    source_url: https://api.bls.gov/publicAPI/v1/timeseries/data/CUSR0000SA0L1E?startyear={start_year}&endyear={end_year}
    url_year: current
    parser: bls_series
    access: public_no_key
    format: json
    series_id: CUSR0000SA0L1E
    seasonal_adjustment: SA
    expected_measures: [cpi_core_mom, cpi_core_yoy]
    measure_definitions:
      cpi_core_mom: BLS:CUSR0000SA0L1E:SA:pct_change_mom:current_series
      cpi_core_yoy: BLS:CUSR0000SA0L1E:SA:pct_change_yoy:current_series
    measures:
      - measure: cpi_core_mom
        transform: pct_change_mom
        unit: percent
      - measure: cpi_core_yoy
        transform: pct_change_yoy
        unit: percent
    license_note: Official BLS API; core CPI excludes food and energy and is seasonally adjusted.

  - source_id: us_bls_nonfarm_employment_latest
    country: US
    kind: actual_api_current
    source_url: https://api.bls.gov/publicAPI/v1/timeseries/data/CES0000000001?startyear={start_year}&endyear={end_year}
    url_year: current
    parser: bls_series
    access: public_no_key
    format: json
    series_id: CES0000000001
    seasonal_adjustment: SA
    expected_measures: [total_nonfarm_employment, nfp_monthly_change]
    measure_definitions:
      total_nonfarm_employment: BLS:CES0000000001:SA:employment_level:thousand_persons
      nfp_monthly_change: BLS:CES0000000001:SA:current_total_level_difference:thousand_persons
    measures:
      - measure: total_nonfarm_employment
        transform: level
        unit: thousand_persons
      - measure: nfp_monthly_change
        transform: difference_mom
        unit: thousand_persons
        derivation: current_total_level_difference
    license_note: Official BLS establishment survey series; current history includes revisions.

  - source_id: us_bls_unemployment_latest
    country: US
    kind: actual_api_current
    source_url: https://api.bls.gov/publicAPI/v1/timeseries/data/LNS14000000?startyear={start_year}&endyear={end_year}
    url_year: current
    parser: bls_series
    access: public_no_key
    format: json
    series_id: LNS14000000
    seasonal_adjustment: SA
    expected_measures: [unemployment_rate]
    measure_definitions:
      unemployment_rate: BLS:LNS14000000:SA:U3:percent
    measures:
      - measure: unemployment_rate
        transform: level
        unit: percent
    license_note: Official BLS household survey series; current history includes revisions.

  - source_id: us_bls_cpi_current_press_release
    country: US
    kind: actual_first_release
    source_url: https://www.bls.gov/news.release/cpi.nr0.htm
    parser: bls_cpi
    access: public_no_key
    format: html
    expected_measures: [cpi_headline_mom, cpi_core_mom]
    original_publication_verified: true
    definition_version: BLS:CPI-U:headline-and-core-monthly:SA:press-release
    license_note: Official BLS current press release; the page may be blocked to automated clients.

  - source_id: us_bls_employment_current_press_release
    country: US
    kind: actual_first_release
    source_url: https://www.bls.gov/news.release/empsit.nr0.htm
    parser: bls_employment
    access: public_no_key
    format: html
    expected_measures: [nfp_monthly_change, unemployment_rate]
    original_publication_verified: true
    definition_version: BLS:employment-situation:headline-series:SA:press-release
    license_note: Official BLS current press release; the page may be blocked to automated clients.

  - source_id: us_bls_release_calendar_current_year
    country: US
    kind: schedule
    source_url: https://www.bls.gov/schedule/{year}/home.htm
    url_year: current
    parser: bls_schedule
    access: public_no_key
    format: html
    license_note: Official BLS calendar; listed local times are Eastern Time and reflect the calendar year requested.

  - source_id: us_bls_release_calendar_next_year
    country: US
    kind: schedule
    source_url: https://www.bls.gov/schedule/{year}/home.htm
    url_year: next
    parser: bls_schedule
    access: public_no_key
    format: html
    license_note: Official BLS calendar; 2027 schedule was available at the research date.

  - source_id: us_bea_pce_latest_release
    country: US
    kind: actual_first_release
    source_url: https://www.bea.gov/news/current-releases
    follow_link_text: Personal Income and Outlays
    parser: bea_pce
    access: public_no_key
    format: html
    expected_measures: [pce_headline_mom, pce_headline_yoy, core_pce_mom, core_pce_yoy]
    original_publication_verified: true
    measure_definitions:
      pce_headline_mom: BEA:PCE-price-index:headline:pct_change_mom:SA:first-release
      pce_headline_yoy: BEA:PCE-price-index:headline:pct_change_yoy:SA:first-release
      core_pce_mom: BEA:PCE-price-index:ex_food_energy:pct_change_mom:SA:first-release
      core_pce_yoy: BEA:PCE-price-index:ex_food_energy:pct_change_yoy:SA:first-release
    license_note: Official BEA release; each linked article is the published release document.

  - source_id: us_bea_release_schedule_current_year
    country: US
    kind: schedule
    source_url: https://www.bea.gov/news/schedule/full
    calendar_year: current
    parser: bea_schedule
    access: public_no_key
    format: html
    license_note: Official BEA calendar; PIO is scheduled at 08:30 America/New_York.

  - source_id: us_bea_release_schedule_next_year
    country: US
    kind: schedule
    source_url: https://www.bea.gov/news/schedule/next-year
    calendar_year: next
    parser: bea_schedule
    access: public_no_key
    format: html
    license_note: Official BEA calendar; 2027 dates and 08:30 ET were published.

  - source_id: us_bea_api_structured_history
    country: US
    kind: actual_api_history
    source_url: https://apps.bea.gov/api/data
    parser: manual_import
    access: api_key_required
    key_env: BEA_API_KEY
    format: json
    structured_import: https://apps.bea.gov/api/signup/
    expected_measures: [pce_headline_mom, pce_headline_yoy, core_pce_mom, core_pce_yoy]
    license_note: Official BEA API requires a registered UserID; no key is configured.

  # Korea: official releases are keyless; 2027 BOK meeting dates are a PDF attachment.
  - source_id: kr_bok_latest_policy_decision
    country: KR
    kind: actual_first_release
    source_url: https://www.bok.or.kr/eng/main/main.do
    follow_link_text: 'Monetary Policy Decision.*20[0-9]{2}'
    parser: bok_rate
    access: public_no_key
    format: html
    expected_measures: [policy_rate]
    original_publication_verified: true
    definition_version: BOK:base-rate:policy-board-decision:percent
    license_note: Official Bank of Korea policy decision page; article date is published, decision clock time is not stated.

  - source_id: kr_mods_cpi_latest_release
    country: KR
    kind: actual_first_release
    source_url: https://mods.go.kr/board.es?bid=11751&mid=a20101000000
    follow_link_text: Consumer Price Index in
    parser: mods_cpi
    access: public_no_key
    format: html
    expected_measures: [cpi_headline_mom, cpi_headline_yoy, cpi_core_mom, cpi_core_yoy]
    original_publication_verified: true
    definition_version: MODS:CPI:headline-and-ex-food-energy:monthly:NSA:release
    license_note: Official Ministry of Data and Statistics release page; release date is listed, clock time is not.

  - source_id: kr_mods_employment_latest_release
    country: KR
    kind: actual_first_release
    source_url: https://mods.go.kr/board.es?bid=11732&mid=a20105020000
    follow_link_text: Economically Active Population Survey in
    parser: mods_employment
    access: public_no_key
    format: html
    expected_measures: [employment_yoy_change, unemployment_rate]
    original_publication_verified: true
    definition_version: MODS:EAPS:employment-yoy-and-unemployment:release
    license_note: Official Ministry of Data and Statistics release page; release date is listed, clock time is not.

  - source_id: kr_bok_2027_policy_calendar_pdf
    country: KR
    kind: schedule
    source_url: https://www.bok.or.kr/eng/bbs/E0000634/view.do?depth=400423&menuNo=400423&nttId=11066076&programType=newsDataEn&relate=Y
    parser: manual_import
    access: public_no_key
    format: html-with-pdf-attachment
    unavailable_reason: official_2027_policy_dates_are_in_pdf_attachment;manual_structured_import_required
    license_note: Official 2027 BOK meeting dates page; attachment parsing is not implemented.

  - source_id: kr_mods_current_release_calendar
    country: KR
    kind: schedule
    source_url: https://mods.go.kr/schdl.es?mid=a20301000000
    parser: manual_import
    access: public_no_key
    format: html
    unavailable_reason: current_official_calendar_lists_2026_only;2027_release_dates_not_published_as_of_2026-11-14
    license_note: Official Ministry of Data and Statistics schedule; the schedule may change.

  - source_id: kr_kosis_structured_history
    country: KR
    kind: actual_api_history
    source_url: https://kosis.kr/openapi/Param/statisticsParameterData.do
    parser: manual_import
    access: api_key_required
    key_env: KOSIS_API_KEY
    format: json
    structured_import: https://kosis.kr/openapi/index/index.jsp
    license_note: Official KOSIS API requires a registered key; no key is configured.

  - source_id: kr_bok_ecos_structured_history
    country: KR
    kind: actual_api_history
    source_url: https://ecos.bok.or.kr/api/StatisticSearch
    parser: manual_import
    access: api_key_required
    key_env: BOK_ECOS_API_KEY
    format: json-or-xml
    structured_import: https://ecos.bok.or.kr/api/
    license_note: Official ECOS API requires a registered key; no key is configured.

  # Japan: latest summary pages are current snapshots; scheduled dates carry no guessed clock time.
  - source_id: jp_boj_latest_policy_decision
    country: JP
    kind: actual_policy_rate
    source_url: https://www.boj.or.jp/en/mopo/mpmdeci/
    parser: manual_import
    access: public_no_key
    format: html-with-pdf-release
    expected_measures: [policy_rate]
    unavailable_reason: boJ_target_rate_is_published_in_policy_statement_pdf;manual_structured_import_required
    license_note: Official BOJ policy statements are linked from the current decisions page.

  - source_id: jp_boj_meeting_schedule
    country: JP
    kind: schedule
    source_url: https://www.boj.or.jp/en/mopo/mpmsche_minu/
    parser: boj_schedule
    access: public_no_key
    format: html
    license_note: Official BOJ meeting dates; meeting decision time is not listed.

  - source_id: jp_stats_cpi_latest
    country: JP
    kind: actual_current_snapshot
    source_url: https://www.stat.go.jp/data/cpi/sokuhou/tsuki/index-z.html
    parser: jp_cpi
    access: public_no_key
    format: shift-jis-html
    expected_measures: [cpi_headline_yoy, cpi_core_yoy]
    measure_definitions:
      cpi_headline_yoy: Japan-Statistics:CPI:all-items:yoy:NSA:2025-base
      cpi_core_yoy: Japan-Statistics:CPI:ex-fresh-food:yoy:NSA:2025-base
    license_note: Statistics Bureau of Japan public current summary; latest page rolls forward and does not preserve historical vintages.

  - source_id: jp_stats_cpi_release_schedule
    country: JP
    kind: schedule
    source_url: https://www.stat.go.jp/english/data/cpi/1582.htm
    parser: jp_cpi_schedule
    schedule_kind: cpi
    access: public_no_key
    format: html
    license_note: Official Japan CPI release schedule; listed dates do not state a publication time.

  - source_id: jp_stats_employment_latest
    country: JP
    kind: actual_current_snapshot
    source_url: https://www.stat.go.jp/data/roudou/sokuhou/tsuki/index.html
    parser: jp_employment
    access: public_no_key
    format: shift-jis-html
    expected_measures: [employment_yoy_change, unemployment_rate]
    measure_definitions:
      employment_yoy_change: Japan-Statistics:LFS:employed-persons:yoy:NSA:monthly-summary
      unemployment_rate: Japan-Statistics:LFS:unemployment:SA:monthly-summary
    license_note: Statistics Bureau of Japan public current result; seasonal adjustments are periodically revised.

  - source_id: jp_stats_employment_release_schedule
    country: JP
    kind: schedule
    source_url: https://www.stat.go.jp/english/data/roudou/1543.html
    parser: jp_lfs_schedule
    schedule_kind: lfs
    access: public_no_key
    format: html
    license_note: Official Labour Force Survey schedule; basic tabulation time is not stated on this page.

  - source_id: jp_estat_structured_history
    country: JP
    kind: actual_api_history
    source_url: https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData
    parser: manual_import
    access: api_key_required
    key_env: E_STAT_APP_ID
    format: json
    structured_import: https://www.e-stat.go.jp/api/
    license_note: Official e-Stat API requires an application ID; no key is configured.

  # Euro area: ECB policy rates and Eurostat unemployment are keyless current sources.
  - source_id: ea_ecb_latest_policy_rates
    country: EA
    kind: actual_current_snapshot
    source_url: https://www.ecb.europa.eu/press/press_conference/html/index.en.html
    parser: ecb_policy
    access: public_no_key
    format: html
    vintage: current_snapshot
    expected_measures: [policy_rate]
    definition_version: ECB:deposit-facility-rate:current:percent
    license_note: Official ECB latest press conference; the current page rolls to the latest meeting.

  - source_id: ea_ecb_policy_calendar
    country: EA
    kind: schedule
    source_url: https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
    parser: ecb_schedule
    access: public_no_key
    format: html
    license_note: Official Governing Council calendar; decision dates are shown without an exact decision clock time.

  - source_id: ea_eurostat_unemployment_latest
    country: EA
    kind: actual_api_current
    source_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m?geo=EA21&unit=PC_ACT&age=TOTAL&sex=T&s_adj=SA&freq=M&lang=en
    parser: eurostat_api
    access: public_no_key
    format: json-stat
    measure: unemployment_rate
    unit: percent
    seasonal_adjustment: SA
    expected_measures: [unemployment_rate]
    definition_version: Eurostat:une_rt_m:EA21:T:TOTAL:SA:PC_ACT
    max_reference_lag_months: 2
    license_note: Official Eurostat data API is keyless; current seasonal-adjusted data may be revised.

  - source_id: ea_eurostat_hicp_current_series
    country: EA
    kind: actual_api_current
    source_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_manr?freq=M&unit=RCH_A&coicop=CP00&geo=EA21&lang=en
    parser: eurostat_api
    access: public_no_key
    format: json-stat
    measure: cpi_headline_yoy
    unit: percent
    seasonal_adjustment: NSA
    expected_measures: [cpi_headline_yoy]
    definition_version: Eurostat:prc_hicp_manr:EA21:CP00:RCH_A:current-series
    max_reference_lag_months: 2
    license_note: Official Eurostat HICP API; this series endpoint may lag the flash release and is stale-checked.

  - source_id: ea_eurostat_release_calendar
    country: EA
    kind: schedule
    source_url: https://ec.europa.eu/eurostat/web/main/news/release-calendar
    parser: manual_import
    access: public_no_key
    format: html
    unavailable_reason: official_calendar_is_accessible_but_indicator_specific_schedule_parser_not_implemented
    license_note: Official Eurostat release calendar; no future indicator dates are inferred when parsing is unavailable.
